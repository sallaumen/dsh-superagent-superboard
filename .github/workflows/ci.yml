name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: "backend · partição ${{ matrix.partition }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
        ports: ["5434:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps e builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix gate

  frontend:
    name: "frontend · assets"
    runs-on: ubuntu-latest

    # esbuild/tailwind são dependências de dev, então o build de assets usa MIX_ENV=dev.
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps e ferramentas de assets
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build
      - run: mix assets.deploy

  library:
    name: "biblioteca de capacidades"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Valida a biblioteca de capacidades
        run: |
          python3 capabilities/tools/validar_biblioteca.py
          python3 capabilities/tools/test_validar_biblioteca.py

  release:
    name: "release · caminho misto (backend + frontend)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps e builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      # esbuild/tailwind só existem no ambiente dev; os assets são
      # construídos em dev e apenas digeridos/embalados no ambiente prod.
      - name: Constrói assets (toolchain de dev)
        env:
          MIX_ENV: dev
        run: |
          mix assets.setup
          mix assets.build

      - name: Compila produção
        env:
          MIX_ENV: prod
        run: mix compile --warnings-as-errors

      - name: Digere assets e monta o release
        env:
          MIX_ENV: prod
        run: |
          mix phx.digest
          mix release --overwrite
